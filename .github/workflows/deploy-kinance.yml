# DO NOT MODIFY without professional audit.
# This workflow is part of the KiBot Risk Guardrail system.
name: Deploy Kinance

on:
  push:
    branches: [main]
    paths-ignore:
      - "packages/indodax-client/**"
      - ".github/workflows/deploy-kidax.yml"
      - "infra/systemd/kidax-engine.service"
      - "SSH_INDODAX/**"
  workflow_dispatch:

concurrency:
  group: deploy-kinance
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: ${{ secrets.KINANCE_HOST }}
      DEPLOY_USER: ${{ secrets.KINANCE_USER }}
      DEPLOY_KEY: ${{ secrets.KINANCE_SSH }}
      DEPLOY_PORT: ${{ secrets.KINANCE_SSH_PORT || '22' }}
      REMOTE_ROOT: /home/ubuntu/Kinance
      SERVICE_NAME: kinance-engine
      SERVICE_FILE: infra/systemd/kinance-engine.service
      RUNTIME_PORT: "8788"
      ENV_FILE: .env.kinance
      BOT_ID: kinance
      BOT_PROFILE_KEY: kinance
      EXCHANGE_KIND: BINANCE_SPOT
      DEVICE_ID: kinance-oracle-sg
      DEVICE_DISPLAY_NAME: Kinance Oracle Singapore
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin

      - name: Build Runtime Jar
        run: |
          chmod +x gradlew
          ./gradlew :apps:mac-engine:fatJar --no-daemon

      - name: Check Build Output
        run: |
          test -f apps/mac-engine/build/libs/mac-engine-0.1.0-all.jar

      - name: Validate Deploy Secrets
        run: |
          set -euo pipefail
          test -n "${DEPLOY_HOST:-}" || (echo "Missing KINANCE_HOST" && exit 1)
          test -n "${DEPLOY_USER:-}" || (echo "Missing KINANCE_USER" && exit 1)
          test -n "${DEPLOY_KEY:-}" || (echo "Missing KINANCE_SSH" && exit 1)

      - name: Stage Runtime Bundle
        run: |
          mkdir -p .deploy/scripts .deploy/infra/systemd
          cp apps/mac-engine/build/libs/mac-engine-0.1.0-all.jar .deploy/mac-engine-all.jar
          cp "$SERVICE_FILE" .deploy/infra/systemd/
          cp infra/scripts/engine-recovery.sh .deploy/engine-recovery.sh
          cp infra/scripts/setup-engine-autorecover.sh .deploy/setup-autorecover.sh
          cp scripts/sync_env_to_server.sh .deploy/scripts/
          cp scripts/kibot_manager.py .deploy/scripts/
          cp scripts/kibot_whatif_engine.py .deploy/scripts/
          cp scripts/kibot_learning_engine.py .deploy/scripts/
          cp scripts/kibot_timeframe_analyzer.py .deploy/scripts/
          cp scripts/dashboard_template.py .deploy/scripts/

      - name: Prepare Remote Directories
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.DEPLOY_HOST }}
          port: ${{ env.DEPLOY_PORT }}
          username: ${{ env.DEPLOY_USER }}
          key: ${{ env.DEPLOY_KEY }}
          envs: REMOTE_ROOT,ENV_FILE
          script: |
            set -euo pipefail
            mkdir -p "${REMOTE_ROOT}/server" "${REMOTE_ROOT}/scripts" "${REMOTE_ROOT}/infra/systemd" "${REMOTE_ROOT}/.tmp"
            touch "${REMOTE_ROOT}/${ENV_FILE}"
            chmod 700 "${REMOTE_ROOT}"
            chmod 600 "${REMOTE_ROOT}/${ENV_FILE}"

      - name: Sync Runtime Bundle via rsync
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "${DEPLOY_KEY}" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p "${DEPLOY_PORT}" "${DEPLOY_HOST}" >> ~/.ssh/known_hosts
          rsync -avz -e "ssh -p ${DEPLOY_PORT} -i ~/.ssh/id_rsa" .deploy/ "${DEPLOY_USER}@${DEPLOY_HOST}:${REMOTE_ROOT}/"
          rm -f ~/.ssh/id_rsa

      - name: Install and Restart Kinance
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.DEPLOY_HOST }}
          port: ${{ env.DEPLOY_PORT }}
          username: ${{ env.DEPLOY_USER }}
          key: ${{ env.DEPLOY_KEY }}
          envs: REMOTE_ROOT,SERVICE_NAME,RUNTIME_PORT,ENV_FILE,BOT_ID,BOT_PROFILE_KEY,EXCHANGE_KIND,DEVICE_ID,DEVICE_DISPLAY_NAME
          script: |
            set -euo pipefail
            RELEASE_LABEL="#${{ github.run_number }}"

            ensure_env() {
              local key="$1"
              local value="$2"
              if grep -q "^${key}=" "${REMOTE_ROOT}/${ENV_FILE}"; then
                sed -i "s|^${key}=.*|${key}=${value}|" "${REMOTE_ROOT}/${ENV_FILE}"
              else
                echo "${key}=${value}" >> "${REMOTE_ROOT}/${ENV_FILE}"
              fi
            }

            ensure_env KIBOT_RELEASE_LABEL "${RELEASE_LABEL}"
            ensure_env BOT_ID "${BOT_ID}"
            ensure_env BOT_PROFILE_KEY "${BOT_PROFILE_KEY}"
            ensure_env KIBOT_EXCHANGE_KIND "${EXCHANGE_KIND}"
            ensure_env DEVICE_ID "${DEVICE_ID}"
            ensure_env DEVICE_DISPLAY_NAME "\"${DEVICE_DISPLAY_NAME}\""
            ensure_env KIBOT_RUNTIME_ROOT "${REMOTE_ROOT}"
            ensure_env KIBOT_DASHBOARD_PORT "${RUNTIME_PORT}"
            ensure_env KIBOT_ENV_FILE "${REMOTE_ROOT}/${ENV_FILE}"
            ensure_env MAC_ENGINE_PORT "${RUNTIME_PORT}"
            ensure_env MAC_ENGINE_BIND_HOST 0.0.0.0

            mv "${REMOTE_ROOT}/mac-engine-all.jar" "${REMOTE_ROOT}/server/mac-engine-all.jar"
            chmod +x "${REMOTE_ROOT}/engine-recovery.sh" "${REMOTE_ROOT}/setup-autorecover.sh" "${REMOTE_ROOT}/scripts/sync_env_to_server.sh" || true
            sudo cp "${REMOTE_ROOT}/infra/systemd/kinance-engine.service" "/etc/systemd/system/${SERVICE_NAME}.service"
            sudo systemctl stop "${SERVICE_NAME}" || true
            sudo fuser -k "${RUNTIME_PORT}/tcp" || true
            sudo systemctl daemon-reload
            sudo systemctl enable "${SERVICE_NAME}"
            sudo systemctl restart "${SERVICE_NAME}"
            sudo systemctl is-active "${SERVICE_NAME}"

            echo "Waiting for health check on port ${RUNTIME_PORT}..."
            sleep 10
            if ! curl -fsS --retry 20 --retry-connrefused --retry-delay 5 http://127.0.0.1:${RUNTIME_PORT}/api/state >/tmp/kinance-state.json; then
              echo "❌ Health check failed! Logs:"
              sudo journalctl -u ${SERVICE_NAME} -n 100 --no-pager
              exit 1
            fi
            echo "✅ Deployment successful!"
            cat /tmp/kinance-state.json
            rm -rf ${REMOTE_ROOT}/.deploy
            rm -rf ${REMOTE_ROOT}/.tmp/*

      - name: Notify on Failure
        if: failure()
        run: |
          echo "❌ DEPLOYMENT FAILED! Check 'Install and Restart' logs for details."
