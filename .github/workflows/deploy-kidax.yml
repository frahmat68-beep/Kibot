name: Deploy KiBot Indodax

on:
  push:
    branches: [main]
    paths-ignore:
      - "packages/binance-client/**"
      - ".github/workflows/deploy-kinance.yml"
      - "infra/systemd/kinance-engine.service"
      - "SSH_BINANCE/**"
  workflow_dispatch:

concurrency:
  group: deploy-kidax
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: ${{ secrets.KIDAX_HOST }}
      DEPLOY_USER: ${{ secrets.KIDAX_USER }}
      DEPLOY_KEY: ${{ secrets.KIDAX_SSH }}
      DEPLOY_PORT: ${{ secrets.KIDAX_SSH_PORT || '22' }}
      REMOTE_ROOT: /home/ubuntu/KiBot
      SERVICE_NAME: kidax-engine
      SERVICE_FILE: infra/systemd/kidax-engine.service
      RUNTIME_PORT: "8787"
      ENV_FILE: .env.kibot
      BOT_ID: main
      BOT_PROFILE_KEY: indodax
      EXCHANGE_KIND: INDODAX
      DEVICE_ID: kibot-oracle-indodax
      DEVICE_DISPLAY_NAME: KiBot Oracle Indodax
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Validate Python Syntax
        run: |
          python3 -m py_compile scripts/*.py
          python3 -m py_compile tests/test_whatif_complete.py

      - name: Logic Regression Tests
        run: |
          python3 scripts/test_v7_logic.py
          python3 tests/test_whatif_complete.py
          python3 scripts/trinity_production_test.py
          python3 scripts/verify_integration.py
          python3 scripts/test_offline.py 2>/dev/null || echo "test_offline done"
          python3 scripts/test_local_signal.py 2>/dev/null || echo "test_local done"

      - name: Validate Build
        run: |
          chmod +x gradlew
          export GRADLE_OPTS="-Xmx2048m -Dorg.gradle.daemon=false"
          ./gradlew :apps:mac-engine:fatJar --no-daemon

      - name: Check Build Output
        run: |
          JAR_PATH=$(find apps/mac-engine/build/libs -name "*-all.jar" | head -n 1)
          if [ -z "$JAR_PATH" ]; then
            echo "❌ Build output JAR not found!"
            exit 1
          fi
          echo "JAR_PATH=$JAR_PATH" >> $GITHUB_ENV
          mkdir -p .deploy/infra/systemd .deploy/scripts
          cp "$JAR_PATH" .deploy/mac-engine-all.jar
          cp "$SERVICE_FILE" .deploy/infra/systemd/

      - name: Stage Runtime Bundle
        run: |
          mkdir -p .deploy/scripts .deploy/infra/systemd
          cp -r scripts/* .deploy/scripts/
          cp -r infra/systemd/* .deploy/infra/systemd/
          # Ensure critical binary is renamed for standard local sync
          cp "$JAR_PATH" .deploy/mac-engine-all.jar

      - name: Prepare Remote Directories
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.DEPLOY_HOST }}
          port: ${{ env.DEPLOY_PORT }}
          username: ${{ env.DEPLOY_USER }}
          key: ${{ env.DEPLOY_KEY }}
          envs: REMOTE_ROOT,ENV_FILE
          script: |
            set -euo pipefail
            mkdir -p ${REMOTE_ROOT}/server ${REMOTE_ROOT}/scripts ${REMOTE_ROOT}/infra/systemd ${REMOTE_ROOT}/.tmp
            touch ${REMOTE_ROOT}/${ENV_FILE}
            chmod 700 ${REMOTE_ROOT}
            chmod 600 ${REMOTE_ROOT}/${ENV_FILE}

      - name: Sync Runtime Bundle via rsync
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "${{ env.DEPLOY_KEY }}" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p ${{ env.DEPLOY_PORT }} ${{ env.DEPLOY_HOST }} >> ~/.ssh/known_hosts
          rsync -avz -e "ssh -p ${{ env.DEPLOY_PORT }} -i ~/.ssh/id_rsa" .deploy/ ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }}:${{ env.REMOTE_ROOT }}/
          rm -f ~/.ssh/id_rsa

      - name: Install and Restart KiBot Indodax
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.DEPLOY_HOST }}
          port: ${{ env.DEPLOY_PORT }}
          username: ${{ env.DEPLOY_USER }}
          key: ${{ env.DEPLOY_KEY }}
          envs: REMOTE_ROOT,SERVICE_NAME,RUNTIME_PORT,ENV_FILE,BOT_ID,BOT_PROFILE_KEY,EXCHANGE_KIND,DEVICE_ID,DEVICE_DISPLAY_NAME
          script: |
            set -euo pipefail
            RELEASE_LABEL="#${{ github.run_number }}"
            ensure_env() {
              KEY="$1"
              VALUE="$2"
              if grep -q "^${KEY}=" ${REMOTE_ROOT}/${ENV_FILE}; then
                sed -i "s|^${KEY}=.*|${KEY}=${VALUE}|" ${REMOTE_ROOT}/${ENV_FILE}
              else
                echo "${KEY}=${VALUE}" >> ${REMOTE_ROOT}/${ENV_FILE}
              fi
            }
            ensure_env KIBOT_RELEASE_LABEL ${RELEASE_LABEL}
            ensure_env BOT_ID ${BOT_ID}
            ensure_env BOT_PROFILE_KEY ${BOT_PROFILE_KEY}
            ensure_env KIBOT_EXCHANGE_KIND ${EXCHANGE_KIND}
            ensure_env DEVICE_ID ${DEVICE_ID}
            ensure_env DEVICE_DISPLAY_NAME '"'"${DEVICE_DISPLAY_NAME}"'"'
            ensure_env KIBOT_RUNTIME_ROOT ${REMOTE_ROOT}
            ensure_env KIBOT_DASHBOARD_PORT ${RUNTIME_PORT}
            ensure_env KIBOT_ENV_FILE ${REMOTE_ROOT}/${ENV_FILE}
            ensure_env MAC_ENGINE_PORT ${RUNTIME_PORT}
            ensure_env MAC_ENGINE_BIND_HOST 0.0.0.0

            sudo systemctl stop ${SERVICE_NAME} || true

            mv ${REMOTE_ROOT}/mac-engine-all.jar ${REMOTE_ROOT}/server/mac-engine-all.jar
            sudo cp ${REMOTE_ROOT}/infra/systemd/kidax-engine.service /etc/systemd/system/${SERVICE_NAME}.service
            for svc_file in \
              kibot-analyst.service \
              kibot-guardian.service \
              kibot-auditor.service \
              kibot-notifier.service \
              kibot-orchestrator.service \
              kibot-security.service; do
              sudo cp ${REMOTE_ROOT}/infra/systemd/${svc_file} /etc/systemd/system/${svc_file}
            done
            
            # [INTERNAL SMOKE TEST] Validate environment before restart
            python3 ${REMOTE_ROOT}/scripts/kibot_smoke_test.py

            sudo systemctl stop ${SERVICE_NAME} || true
            sudo systemctl kill ${SERVICE_NAME} || true
            sudo pkill -9 -f mac-engine-all.jar || true
            sudo fuser -k ${RUNTIME_PORT}/tcp || true
            sleep 2
            sudo systemctl daemon-reload
            sudo systemctl disable ${SERVICE_NAME} || true
            sudo rm -f /etc/systemd/system/multi-user.target.wants/${SERVICE_NAME}.service
            sudo systemctl reenable ${SERVICE_NAME}
            sudo systemctl restart ${SERVICE_NAME}
            for svc in kibot-analyst kibot-guardian kibot-auditor kibot-notifier kibot-orchestrator kibot-security; do
              sudo systemctl disable ${svc} || true
              sudo rm -f /etc/systemd/system/multi-user.target.wants/${svc}.service
              sudo systemctl reenable ${svc}
              sudo systemctl restart ${svc}
              sudo systemctl is-active ${svc}
            done

            echo "Waiting for health check on port ${RUNTIME_PORT}..."
            sleep 15
            if ! curl -fsS --retry 10 --retry-delay 5 http://127.0.0.1:${RUNTIME_PORT}/api/state > /tmp/kibot-state.json; then
              echo "❌ Health check failed! Logs:"
              sudo journalctl -u ${SERVICE_NAME} -n 100 --no-pager
              exit 1
            fi
            echo "✅ Deployment successful!"
            cat /tmp/kibot-state.json
            rm -rf ${REMOTE_ROOT}/.deploy
            rm -rf ${REMOTE_ROOT}/.tmp/*

      - name: Notify on Failure
        if: failure()
        run: |
          echo "❌ DEPLOYMENT FAILED! Check 'Install and Restart' logs for details."
          echo "Recent errors on server:"
          # This will show up in the GitHub UI Job summary/logs
