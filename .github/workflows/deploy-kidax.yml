name: Deploy KiDax

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'packages/binance-client/**'
      - '.github/workflows/deploy-kinance.yml'
      - 'infra/systemd/kinance-engine.service'
      - 'SSH_BINANCE/**'
  workflow_dispatch:

concurrency:
  group: deploy-kidax
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: ${{ secrets.KIDAX_HOST }}
      DEPLOY_USER: ${{ secrets.KIDAX_USER }}
      DEPLOY_KEY: ${{ secrets.KIDAX_SSH }}
      DEPLOY_PORT: ${{ secrets.KIDAX_SSH_PORT || '22' }}
      REMOTE_ROOT: /home/ubuntu/KiDax
      SERVICE_NAME: kidax-engine
      SERVICE_FILE: infra/systemd/kidax-engine.service
      RUNTIME_PORT: '8787'
      ENV_FILE: .env.kidax
      BOT_ID: main
      BOT_PROFILE_KEY: indodax
      EXCHANGE_KIND: INDODAX
      DEVICE_ID: kidax-oracle-sg
      DEVICE_DISPLAY_NAME: KiDax Oracle Singapore
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Validate Build
        run: |
          chmod +x gradlew
          ./gradlew :packages:core:jvmTest :apps:mac-engine:test :apps:mac-engine:fatJar --no-daemon

      - name: Validate Deploy Secrets
        run: |
          set -euo pipefail
          test -n "${DEPLOY_HOST:-}" || (echo 'Missing KIDAX_HOST' && exit 1)
          test -n "${DEPLOY_USER:-}" || (echo 'Missing KIDAX_USER' && exit 1)
          test -n "${DEPLOY_KEY:-}" || (echo 'Missing KIDAX_SSH' && exit 1)

      - name: Stage Runtime Bundle
        run: |
          mkdir -p .deploy/scripts .deploy/infra/systemd
          cp apps/mac-engine/build/libs/mac-engine-0.1.0-all.jar .deploy/mac-engine-all.jar
          cp "$SERVICE_FILE" .deploy/infra/systemd/
          cp infra/scripts/engine-recovery.sh .deploy/engine-recovery.sh
          cp infra/scripts/setup-engine-autorecover.sh .deploy/setup-autorecover.sh
          cp scripts/audit_trading_6h_ai.py .deploy/scripts/
          cp scripts/ai_learning_cycle.sh .deploy/scripts/
          cp scripts/run_ai_auditors_hourly.sh .deploy/scripts/
          cp scripts/test_ai_auditors.sh .deploy/scripts/
          cp scripts/sync_env_to_server.sh .deploy/scripts/

      - name: Prepare Remote Directories
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.DEPLOY_HOST }}
          port: ${{ env.DEPLOY_PORT }}
          username: ${{ env.DEPLOY_USER }}
          key: ${{ env.DEPLOY_KEY }}
          script: |
            set -euo pipefail
            mkdir -p ${{ env.REMOTE_ROOT }}/server ${{ env.REMOTE_ROOT }}/scripts ${{ env.REMOTE_ROOT }}/infra/systemd ${{ env.REMOTE_ROOT }}/.tmp
            touch ${{ env.REMOTE_ROOT }}/${{ env.ENV_FILE }}
            chmod 700 ${{ env.REMOTE_ROOT }}
            chmod 600 ${{ env.REMOTE_ROOT }}/${{ env.ENV_FILE }}

      - name: Copy Runtime Bundle
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.DEPLOY_HOST }}
          port: ${{ env.DEPLOY_PORT }}
          username: ${{ env.DEPLOY_USER }}
          key: ${{ env.DEPLOY_KEY }}
          source: '.deploy/*'
          target: '${{ env.REMOTE_ROOT }}/'
          strip_components: 1

      - name: Install and Restart KiDax
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.DEPLOY_HOST }}
          port: ${{ env.DEPLOY_PORT }}
          username: ${{ env.DEPLOY_USER }}
          key: ${{ env.DEPLOY_KEY }}
          script: |
            set -euo pipefail
            RELEASE_LABEL="#${{ github.run_number }}"
            ensure_env() {
              KEY="$1"
              VALUE="$2"
              if grep -q "^${KEY}=" ${REMOTE_ROOT}/${ENV_FILE}; then
                sed -i "s|^${KEY}=.*|${KEY}=${VALUE}|" ${REMOTE_ROOT}/${ENV_FILE}
              else
                echo "${KEY}=${VALUE}" >> ${REMOTE_ROOT}/${ENV_FILE}
              fi
            }
            ensure_env KIBOT_RELEASE_LABEL ${RELEASE_LABEL}
            ensure_env BOT_ID ${BOT_ID}
            ensure_env BOT_PROFILE_KEY ${BOT_PROFILE_KEY}
            ensure_env KIBOT_EXCHANGE_KIND ${EXCHANGE_KIND}
            ensure_env DEVICE_ID ${DEVICE_ID}
            ensure_env DEVICE_DISPLAY_NAME '"'"${DEVICE_DISPLAY_NAME}"'"'
            ensure_env KIBOT_RUNTIME_ROOT ${REMOTE_ROOT}
            ensure_env KIBOT_SERVICE_NAME ${SERVICE_NAME}
            ensure_env KIBOT_DASHBOARD_PORT ${RUNTIME_PORT}
            ensure_env KIBOT_ENV_FILE ${{ env.REMOTE_ROOT }}/${{ env.ENV_FILE }}
            mv ${{ env.REMOTE_ROOT }}/mac-engine-all.jar ${{ env.REMOTE_ROOT }}/server/mac-engine-all.jar
            chmod +x ${{ env.REMOTE_ROOT }}/engine-recovery.sh ${{ env.REMOTE_ROOT }}/setup-autorecover.sh ${{ env.REMOTE_ROOT }}/scripts/ai_learning_cycle.sh ${{ env.REMOTE_ROOT }}/scripts/run_ai_auditors_hourly.sh ${{ env.REMOTE_ROOT }}/scripts/test_ai_auditors.sh ${{ env.REMOTE_ROOT }}/scripts/sync_env_to_server.sh
            sudo cp ${{ env.REMOTE_ROOT }}/infra/systemd/kidax-engine.service /etc/systemd/system/${SERVICE_NAME}.service
            sudo systemctl stop ${SERVICE_NAME} || true
            sudo fuser -k ${RUNTIME_PORT}/tcp || true
            sudo systemctl daemon-reload
            sudo systemctl enable ${SERVICE_NAME}
            sudo systemctl restart ${SERVICE_NAME}
            sudo systemctl is-active --quiet ${SERVICE_NAME}
            echo "Waiting for engine cold start (60s total max)..."
            curl -fsS --retry 20 --retry-delay 5 http://127.0.0.1:${RUNTIME_PORT}/api/state >/tmp/kidax-state.json
            cat /tmp/kidax-state.json | head -c 800
