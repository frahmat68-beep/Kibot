name: Deploy KiDax

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'packages/binance-client/**'
      - '.github/workflows/deploy-kinance.yml'
      - 'infra/systemd/kinance-engine.service'
      - 'SSH_BINANCE/**'
  workflow_dispatch:

concurrency:
  group: deploy-kidax
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: ${{ secrets.KIDAX_HOST }}
      DEPLOY_USER: ${{ secrets.KIDAX_USER }}
      DEPLOY_KEY: ${{ secrets.KIDAX_SSH }}
      DEPLOY_PORT: ${{ secrets.KIDAX_SSH_PORT || '22' }}
      REMOTE_ROOT: /home/ubuntu/KiDax
      SERVICE_NAME: kidax-engine
      SERVICE_FILE: infra/systemd/kidax-engine.service
      RUNTIME_PORT: '8787'
      ENV_FILE: .env.kidax
      BOT_ID: main
      BOT_PROFILE_KEY: indodax
      EXCHANGE_KIND: INDODAX
      DEVICE_ID: kidax-oracle-sg
      DEVICE_DISPLAY_NAME: KiDax Oracle Singapore
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Validate Build
        run: |
          chmod +x gradlew
          ./gradlew :packages:core:jvmTest :apps:mac-engine:fatJar --no-daemon

      - name: Validate Deploy Secrets
        run: |
          set -euo pipefail
          test -n "${DEPLOY_HOST:-}" || (echo 'Missing KIDAX_HOST' && exit 1)
          test -n "${DEPLOY_USER:-}" || (echo 'Missing KIDAX_USER' && exit 1)
          test -n "${DEPLOY_KEY:-}" || (echo 'Missing KIDAX_SSH' && exit 1)

      - name: Stage Runtime Bundle
        run: |
          mkdir -p .deploy/scripts .deploy/infra/systemd
          cp apps/mac-engine/build/libs/mac-engine-0.1.0-all.jar .deploy/mac-engine-all.jar
          cp "$SERVICE_FILE" .deploy/infra/systemd/
          cp infra/scripts/engine-recovery.sh .deploy/engine-recovery.sh
          cp infra/scripts/setup-engine-autorecover.sh .deploy/setup-autorecover.sh
          cp scripts/sync_env_to_server.sh .deploy/scripts/
          cp scripts/kibot_manager.py .deploy/scripts/
          cp scripts/kibot_whatif_engine.py .deploy/scripts/
          cp scripts/kibot_learning_engine.py .deploy/scripts/
          cp scripts/kibot_timeframe_analyzer.py .deploy/scripts/
          cp scripts/dashboard_template.py .deploy/scripts/

      - name: Prepare Remote Directories
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.DEPLOY_HOST }}
          port: ${{ env.DEPLOY_PORT }}
          username: ${{ env.DEPLOY_USER }}
          key: ${{ env.DEPLOY_KEY }}
          envs: REMOTE_ROOT,ENV_FILE
          script: |
            set -euo pipefail
            mkdir -p ${REMOTE_ROOT}/server ${REMOTE_ROOT}/scripts ${REMOTE_ROOT}/infra/systemd ${REMOTE_ROOT}/.tmp
            touch ${REMOTE_ROOT}/${ENV_FILE}
            chmod 700 ${REMOTE_ROOT}
            chmod 600 ${REMOTE_ROOT}/${ENV_FILE}

      - name: Sync Runtime Bundle via rsync
        run: |
          mkdir -p ~/.ssh
          echo "${{ env.DEPLOY_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p ${{ env.DEPLOY_PORT }} ${{ env.DEPLOY_HOST }} >> ~/.ssh/known_hosts
          rsync -avz -e "ssh -p ${{ env.DEPLOY_PORT }} -i ~/.ssh/id_rsa" .deploy/ ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }}:${{ env.REMOTE_ROOT }}/

      - name: Install and Restart KiDax
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.DEPLOY_HOST }}
          port: ${{ env.DEPLOY_PORT }}
          username: ${{ env.DEPLOY_USER }}
          key: ${{ env.DEPLOY_KEY }}
          envs: REMOTE_ROOT,SERVICE_NAME,RUNTIME_PORT,ENV_FILE,BOT_ID,BOT_PROFILE_KEY,EXCHANGE_KIND,DEVICE_ID,DEVICE_DISPLAY_NAME
          script: |
            set -euo pipefail
            RELEASE_LABEL="#${{ github.run_number }}"
            ensure_env() {
              KEY="$1"
              VALUE="$2"
              if grep -q "^${KEY}=" ${REMOTE_ROOT}/${ENV_FILE}; then
                sed -i "s|^${KEY}=.*|${KEY}=${VALUE}|" ${REMOTE_ROOT}/${ENV_FILE}
              else
                echo "${KEY}=${VALUE}" >> ${REMOTE_ROOT}/${ENV_FILE}
              fi
            }
            ensure_env KIBOT_RELEASE_LABEL ${RELEASE_LABEL}
            ensure_env BOT_ID ${BOT_ID}
            ensure_env BOT_PROFILE_KEY ${BOT_PROFILE_KEY}
            ensure_env KIBOT_EXCHANGE_KIND ${EXCHANGE_KIND}
            ensure_env DEVICE_ID ${DEVICE_ID}
            ensure_env DEVICE_DISPLAY_NAME '"'"${DEVICE_DISPLAY_NAME}"'"'
            ensure_env KIBOT_RUNTIME_ROOT ${REMOTE_ROOT}
            ensure_env KIBOT_SERVICE_NAME ${SERVICE_NAME}
            ensure_env KIBOT_DASHBOARD_PORT ${RUNTIME_PORT}
            ensure_env KIBOT_ENV_FILE ${REMOTE_ROOT}/${ENV_FILE}
            mv ${REMOTE_ROOT}/mac-engine-all.jar ${REMOTE_ROOT}/server/mac-engine-all.jar
            chmod +x ${REMOTE_ROOT}/engine-recovery.sh ${REMOTE_ROOT}/setup-autorecover.sh ${REMOTE_ROOT}/scripts/ai_learning_cycle.sh ${REMOTE_ROOT}/scripts/run_ai_auditors_hourly.sh ${REMOTE_ROOT}/scripts/test_ai_auditors.sh ${REMOTE_ROOT}/scripts/sync_env_to_server.sh
            sudo cp ${REMOTE_ROOT}/infra/systemd/kidax-engine.service /etc/systemd/system/${SERVICE_NAME}.service
            sudo systemctl stop ${SERVICE_NAME} || true
            sudo fuser -k ${RUNTIME_PORT}/tcp || true
            sudo systemctl daemon-reload
            sudo systemctl enable ${SERVICE_NAME}
            sudo systemctl restart ${SERVICE_NAME}
            sudo systemctl is-active --quiet ${SERVICE_NAME}
            echo "Waiting for engine cold start (100s total max)..."
            if ! curl -fsS --retry 20 --retry-connrefused --retry-delay 5 http://127.0.0.1:${RUNTIME_PORT}/api/state >/tmp/kidax-state.json; then
              echo "❌ Health check failed! Recent logs:"
              sudo journalctl -u ${SERVICE_NAME} --no-pager -n 50
              exit 1
            fi
            cat /tmp/kidax-state.json | head -c 800
