name: Deploy KiBot

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: kibot-oracle-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: ${{ secrets.HOST || secrets.SERVER_HOST || secrets.ORACLE_HOST }}
      DEPLOY_USER: ${{ secrets.USERNAME || secrets.SSH_USERNAME || secrets.ORACLE_USER }}
      DEPLOY_KEY: ${{ secrets.SSH_KEY || secrets.SERVER_SSH_KEY || secrets.ORACLE_SSH_KEY }}
    steps:
    - name: Checkout Repo
      uses: actions/checkout@v4

    - name: Set up Java 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Validate Core Builds
      run: |
        chmod +x gradlew
        ./gradlew :packages:core:jvmTest :apps:mac-engine:test :apps:mac-engine:fatJar --no-daemon

    - name: Stage Oracle Runtime Bundle
      run: |
        mkdir -p .deploy
        cp apps/mac-engine/build/libs/mac-engine-0.1.0-all.jar .deploy/mac-engine-all.jar
        cp kibot-engine.service .deploy/kibot-engine.service
        cp kibot-recovery.sh .deploy/kibot-recovery.sh
        cp setup-autorecover.sh .deploy/setup-autorecover.sh

    - name: Validate Deploy Secrets
      run: |
        set -euo pipefail
        if [ -z "${DEPLOY_HOST:-}" ]; then
          echo "Missing deploy host secret. Expected one of: HOST / SERVER_HOST / ORACLE_HOST"
          exit 1
        fi
        if [ -z "${DEPLOY_USER:-}" ]; then
          echo "Missing deploy username secret. Expected one of: USERNAME / SSH_USERNAME / ORACLE_USER"
          exit 1
        fi
        if [ -z "${DEPLOY_KEY:-}" ]; then
          echo "Missing deploy SSH key secret. Expected one of: SSH_KEY / SERVER_SSH_KEY / ORACLE_SSH_KEY"
          exit 1
        fi

    - name: Ensure Remote Runtime Directory
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ env.DEPLOY_HOST }}
        username: ${{ env.DEPLOY_USER }}
        key: ${{ env.DEPLOY_KEY }}
        script: |
          set -euo pipefail
          mkdir -p /home/ubuntu/KiBot
          mkdir -p /home/ubuntu/KiBot/server

    - name: Copy Runtime Bundle to Server
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ env.DEPLOY_HOST }}
        username: ${{ env.DEPLOY_USER }}
        key: ${{ env.DEPLOY_KEY }}
        source: ".deploy/*"
        target: "/home/ubuntu/KiBot/"
        strip_components: 1

    - name: Install and Restart Oracle Bot
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ env.DEPLOY_HOST }}
        username: ${{ env.DEPLOY_USER }}
        key: ${{ env.DEPLOY_KEY }}
        script: |
          set -euo pipefail
          mkdir -p /home/ubuntu/KiBot/server
          rm -f /home/ubuntu/KiBot/server/mac-engine-all.jar
          mv /home/ubuntu/KiBot/mac-engine-all.jar /home/ubuntu/KiBot/server/mac-engine-all.jar
          chmod +x /home/ubuntu/KiBot/kibot-recovery.sh
          chmod +x /home/ubuntu/KiBot/setup-autorecover.sh
          sudo cp /home/ubuntu/KiBot/kibot-engine.service /etc/systemd/system/kibot-engine.service
          sudo systemctl stop kibot.service || true
          sudo systemctl disable kibot.service || true
          sudo rm -f /etc/systemd/system/kibot.service
          sudo systemctl stop kibot-engine || true
          sudo pkill -f 'gradle.*:apps:mac-engine:run' || true
          sudo pkill -f '/home/ubuntu/KiBot/apps/mac-engine/build/libs/mac-engine-0.1.0-all.jar' || true
          sudo pkill -f '/home/ubuntu/mac-engine-0.1.0-all.jar' || true
          sudo pkill -f '/home/ubuntu/KiBot/server/mac-engine-all.jar' || true
          rm -f /home/ubuntu/mac-engine-0.1.0-all.jar
          sudo fuser -k 8787/tcp || true
          sudo systemctl daemon-reload
          sudo systemctl enable kibot-engine
          sudo systemctl restart kibot-engine
          sudo systemctl is-active --quiet kibot-engine
          curl -fsS --retry 10 --retry-delay 3 http://127.0.0.1:8787/api/state >/tmp/kibot-state.json
          curl -fsS --retry 10 --retry-delay 3 http://127.0.0.1:8787/api/logs >/tmp/kibot-logs.json
          curl -fsS --retry 10 --retry-delay 3 http://127.0.0.1:8787/ >/tmp/kibot-root.html
          ! systemctl is-active --quiet kibot.service
          grep 'KiBot Server Monitor' /tmp/kibot-root.html
          grep 'server-monitor-v3' /tmp/kibot-root.html
          cat /tmp/kibot-state.json | head -c 800
