name: Deploy KiBot

on:
  push:
    branches: [ main ]

concurrency:
  group: kibot-oracle-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repo
      uses: actions/checkout@v4

    - name: Set up Java 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Validate Core Builds
      run: |
        chmod +x gradlew
        ./gradlew :packages:core:jvmTest :apps:mac-engine:test :apps:mac-engine:fatJar --no-daemon

    - name: Stage Oracle Runtime Bundle
      run: |
        mkdir -p .deploy
        cp apps/mac-engine/build/libs/mac-engine-0.1.0-all.jar .deploy/mac-engine-all.jar
        cp kibot-engine.service .deploy/kibot-engine.service
        cp kibot-recovery.sh .deploy/kibot-recovery.sh
        cp setup-autorecover.sh .deploy/setup-autorecover.sh

    - name: Copy Runtime Bundle to Server
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_KEY }}
        source: ".deploy/*"
        target: "/home/ubuntu/KiBot/"
        strip_components: 1

    - name: Install and Restart Oracle Bot
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_KEY }}
        script: |
          set -euo pipefail
          mkdir -p /home/ubuntu/KiBot/server
          mv /home/ubuntu/KiBot/mac-engine-all.jar /home/ubuntu/KiBot/server/mac-engine-all.jar
          chmod +x /home/ubuntu/KiBot/kibot-recovery.sh
          chmod +x /home/ubuntu/KiBot/setup-autorecover.sh
          sudo cp /home/ubuntu/KiBot/kibot-engine.service /etc/systemd/system/kibot-engine.service
          sudo systemctl stop kibot-engine || true
          sudo pkill -f '/home/ubuntu/KiBot/server/mac-engine-all.jar' || true
          sudo fuser -k 8787/tcp || true
          sudo systemctl daemon-reload
          sudo systemctl enable kibot-engine
          sudo systemctl restart kibot-engine
          sudo systemctl is-active --quiet kibot-engine
          curl -fsS --retry 10 --retry-delay 3 http://127.0.0.1:8787/api/state >/tmp/kibot-state.json
          curl -fsS --retry 10 --retry-delay 3 http://127.0.0.1:8787/api/logs >/tmp/kibot-logs.json
          curl -fsS --retry 10 --retry-delay 3 http://127.0.0.1:8787/ >/tmp/kibot-root.html
          grep 'KiBot Server Monitor' /tmp/kibot-root.html
          grep 'server-monitor-v3' /tmp/kibot-root.html
          cat /tmp/kibot-state.json | head -c 800
