<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KiBot Trinity v6.0 | Command Center</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0b0e;
            --card-bg: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.08);
            --accent: #00ffa3;
            --danger: #ff4d4d;
            --warning: #ffb800;
            --text-primary: #ffffff;
            --text-secondary: #94a3b8;
            --glass: rgba(255, 255, 255, 0.02);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(0, 255, 163, 0.03) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(255, 77, 77, 0.03) 0%, transparent 40%);
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 1.5rem;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border);
        }

        .logo-area h1 {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(90deg, #fff, var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .logo-area span {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            color: var(--text-secondary);
            text-transform: uppercase;
        }

        .system-status {
            display: flex;
            gap: 1.5rem;
            align-items: center;
        }

        .badge {
            padding: 0.4rem 0.8rem;
            border-radius: 99px;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .badge-healthy { background: rgba(0, 255, 163, 0.1); color: var(--accent); border: 1px solid rgba(0, 255, 163, 0.2); }
        .badge-warning { background: rgba(255, 184, 0, 0.1); color: var(--warning); border: 1px solid rgba(255, 184, 0, 0.2); }
        .badge-danger { background: rgba(255, 77, 77, 0.1); color: var(--danger); border: 1px solid rgba(255, 77, 77, 0.2); }

        .led { width: 8px; height: 8px; border-radius: 50%; box-shadow: 0 0 10px currentColor; }
        .blink { animation: pulse 2s infinite; }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }

        .grid-stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .stat-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 1rem;
            padding: 1.25rem;
            transition: transform 0.3s ease;
        }

        .stat-card .label {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
        }

        .stat-card .value {
            font-size: 1.25rem;
            font-weight: 600;
            font-family: 'JetBrains Mono', monospace;
        }

        .grid-main {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 1rem;
        }

        .panel {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 1rem;
            padding: 1.25rem;
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .panel-title {
            font-size: 1rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .position-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .pos-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border);
            border-radius: 0.75rem;
            padding: 1rem;
        }

        .pos-card.empty {
            border: 1px dashed var(--border);
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-secondary);
            font-style: italic;
            min-height: 100px;
        }

        .pnl-positive { color: var(--accent); }
        .pnl-negative { color: var(--danger); }

        .log-list {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            font-size: 0.8rem;
        }

        .log-item {
            padding: 0.5rem;
            background: rgba(255, 255, 255, 0.01);
            border-radius: 4px;
            border-left: 2px solid var(--border);
        }

        .footer {
            margin-top: 2rem;
            text-align: center;
            font-size: 0.7rem;
            color: var(--text-secondary);
        }

        #ws-status {
            position: fixed;
            top: 20px; right: 20px;
            font-size: 0.65rem;
            padding: 5px 10px;
            border-radius: 20px;
            z-index: 100;
        }
    </style>
</head>
<body>
    <div id="ws-status" class="badge-danger">OFFLINE</div>

    <div class="container">
        <header>
            <div class="logo-area">
                <h1>KIBOT TRINITY</h1>
                <span>Command Center v6.0</span>
            </div>
            <div class="system-status">
                <div id="mode-badge" class="badge badge-healthy">
                    <span id="bot-mode">GROWTH</span>
                </div>
                <div id="status-badge" class="badge badge-healthy">
                    <div class="led blink"></div>
                    <span id="system-state">ONLINE</span>
                </div>
            </div>
        </header>

        <div class="grid-stats">
            <div class="stat-card">
                <div class="label">Total Equity</div>
                <div id="stat-equity" class="value">Rp ---</div>
            </div>
            <div class="stat-card">
                <div class="label">PnL Today</div>
                <div id="stat-pnl" class="value">0.00%</div>
            </div>
            <div class="stat-card">
                <div class="label">Active Positions</div>
                <div id="stat-active" class="value">0 / 5</div>
            </div>
            <div class="stat-card">
                <div class="label">Exchange Ping</div>
                <div id="stat-ping" class="value">-- ms</div>
            </div>
        </div>

        <div class="grid-main">
            <div class="panel">
                <div class="panel-header">
                    <div class="panel-title">Active Portfolio</div>
                </div>
                <div id="position-grid" class="position-grid">
                    <!-- Positions -->
                </div>
            </div>

            <div class="panel">
                <div class="panel-header">
                    <div class="panel-title">System Logs</div>
                </div>
                <div id="log-list" class="log-list">
                    <!-- Logs -->
                </div>
            </div>
        </div>

        <div class="footer">
            KiBot Trinity v6.0 | WebSocket Live Feed | Refreshed: <span id="last-update">--:--:--</span>
        </div>
    </div>

    <script>
        let ws;
        const wsUrl = `ws://${window.location.host}/api/live/ws`;

        function connect() {
            ws = new WebSocket(wsUrl);
            ws.onopen = () => {
                const s = document.getElementById('ws-status');
                s.textContent = 'LIVE';
                s.className = 'badge-healthy';
            };
            ws.onmessage = (e) => {
                const envelope = JSON.parse(e.data);
                if (envelope.type === 'snapshot' && envelope.data) {
                    updateUI(envelope.data);
                }
            };
            ws.onclose = () => {
                const s = document.getElementById('ws-status');
                s.textContent = 'RECONNECTING';
                s.className = 'badge-warning';
                setTimeout(connect, 3000);
            };
        }

        function updateUI(data) {
            document.getElementById('stat-equity').textContent = data.portfolioValueIdr || 'Rp ---';
            document.getElementById('stat-pnl').textContent = data.pnlTodayPctLabel || '0.00%';
            document.getElementById('stat-pnl').className = 'value ' + (data.pnlTodayPctLabel.includes('-') ? 'pnl-negative' : 'pnl-positive');
            document.getElementById('stat-active').textContent = `${data.holdingsDetailed?.length || 0} / 5`;
            document.getElementById('stat-ping').textContent = `${data.exchangePingValueMs || '--'} ms`;
            document.getElementById('bot-mode').textContent = data.operatingMode;
            document.getElementById('system-state').textContent = data.effectiveState;
            document.getElementById('last-update').textContent = new Date().toLocaleTimeString();

            // Positions
            const grid = document.getElementById('position-grid');
            grid.innerHTML = '';
            const holdings = data.holdingsDetailed || [];
            for (let i = 0; i < 5; i++) {
                if (holdings[i]) {
                    const h = holdings[i];
                    const card = document.createElement('div');
                    card.className = 'pos-card';
                    card.innerHTML = `
                        <div style="display:flex; justify-content:space-between; margin-bottom:8px">
                            <b style="text-transform:uppercase">${h.assetCode}</b>
                            <span class="${h.pnlPctLabel.includes('-') ? 'pnl-negative' : 'pnl-positive'}">${h.pnlPctLabel}</span>
                        </div>
                        <div style="font-size:0.7rem; color:var(--text-secondary)">
                            Entry: ${h.entryPriceLabel}<br>
                            Value: ${h.valueIdrLabel}
                        </div>
                    `;
                    grid.appendChild(card);
                } else {
                    const empty = document.createElement('div');
                    empty.className = 'pos-card empty';
                    empty.textContent = `Position Slot ${i+1} Ready`;
                    grid.appendChild(empty);
                }
            }

            // Logs
            const logList = document.getElementById('log-list');
            logList.innerHTML = '';
            (data.liveTimeline || []).slice(0, 10).forEach(log => {
                const item = document.createElement('div');
                item.className = 'log-item';
                item.textContent = `${log.category}: ${log.message}`;
                logList.appendChild(item);
            });
        }

        connect();
    </script>
</body>
</html>
